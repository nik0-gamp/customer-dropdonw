
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="contenedor">
        <h1>¿Cual es tu lenguaje favorito?</h1>
        <p>Selecciona tu lenguaje favorito</p>

        <div class="dropdown">

            <button class="dropdown-btn" id="dropdownBtn">
                <span id="textoSeleccionado">Selecciona una opción</span>
                <span class="flecha">▼</span>
            </button>

            <ul class="dropdown-list" id="dropdownList">

                <li class="opcion">HTML</li>
                <li class="opcion">CSS</li>
                <li class="opcion">JavaScript</li>
                <li class="opcion">Java</li>
                <li class="opcion">Python</li>
                <li class="opcion">PHP</li>

            </ul>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
